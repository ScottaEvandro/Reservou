<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservou! - Adicionar Novo Espaço (Admin)</title>
    <link rel="stylesheet" href="Assets/CSS/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600&family=Montserrat:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

    <div id="header-placeholder"></div>

    <div class="container">
        <h2>Adicionar novo espaço</h2>
        <form id="add-space-form" class="add-space-form">

            <div class="form-group">
                <label for="space-type">Tipo de Espaço:</label>
                <select id="space-type" name="spaceType" required>
                </select>
            </div>

            <div class="form-group">
                <label for="space-name">Nome do Espaço:</label>
                <input type="text" id="space-name" name="spaceName" placeholder="Ex: Salão de Festas Principal"
                    required>
            </div>

            <div class="form-group">
                <label for="space-description">Descrição Detalhada:</label>
                <textarea id="space-description" name="spaceDescription" rows="6"
                    placeholder="Descreva as características do espaço, capacidade, etc." required></textarea>
            </div>

            <div class="form-group">
                <label for="space-capacity">Capacidade Máxima:</label>
                <input type="number" id="space-capacity" name="spaceCapacity" min="1" placeholder="Ex: 50" required>
            </div>

            <div class="form-group">
                <label for="space-price">Valor da Reserva:</label>
                <input type="text" id="space-price" name="spacePrice" placeholder="Ex: 150.00" required>
            </div>

            <div class="form-group">
                <label for="reserve-time">Duração Máxima da Reserva:</label>
                <input type="time" id="reserve-time" name="reserveTime" required>
            </div>

            <div class="form-group">
                <label for="maintenance-time">Duração da Manutenção entre Reservas:</label>
                <input type="time" id="maintenance-time" name="maintenanceTime" required>
            </div>

            <div class="form-group">
                <label for="space-image-url">Upload de Imagens:</label>
                <span>Selecione uma ou mais imagens (JPG, PNG, GIF).</span>
                <p></p>
                <input type="file" id="space-images" name="spaceImages" accept="image/*" multiple>
            </div>

            <div class="form-group">
                <label for="space-status">Status do espaço:</label>
                <select id="space-status" name="spaceStatus" required>
                    <option value="">Selecione o status do espaço</option>
                    <option value=true>Ativo</option>
                    <option value=false>Inativo</option>
                </select>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-circle-plus"></i>
                    <span>Salvar</span>
                </button>
                <a class="btn-secondary" href="dashboard.html"><i class="fas fa-xmark"></i>
                    <span>Cancelar</span>
                </a>
            </div>
        </form>
    </div>

</body>

<div id="footer-placeholder"></div>

<script src="Assets/JavaScript/loadFooterAndHeader.js"></script>
<script src="Assets/JavaScript/loadSpaceTypes.js"></script>
<script src="Assets/JavaScript/AddNewSpace.js"></script>

</html>
