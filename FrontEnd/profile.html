<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservou! - Editar perfil</title>
    <link rel="stylesheet" href="Assets/CSS/styles.css">
    <link rel="stylesheet" href="Assets/CSS/cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600&family=Montserrat:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="cadastro-body">
    <div id="header-placeholder"></div>

    <div class="cadastro-container">
        <h1>Editar Perfil</h1>

        <div id="loadingMessage" style="text-align: center; font-size: 1.1em;">Carregando dados do perfil...</div>
        <div id="errorMessage" class="error" style="display: none;"></div>

        <div class="cadastro-card">
            <form id="cadastro-form" class="cadastro-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Usuário:</label>
                    <input type="text" id="username" name="username" disabled>
                </div>
                <div class="form-group">
                    <label for="cpf"><i class="fas fa-id-card"></i> CPF:</label>
                    <input type="text" id="cpf" name="cpf" disabled>
                </div>
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email:</label>
                    <input type="text" id="email" name="email" placeholder="Seu email" required>
                </div>
                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone"></i> Telefone:</label>
                    <input type="text" id="phone" name="phone" placeholder="Seu telefone" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Nova Senha:</label>
                    <input type="password" id="password" name="password" placeholder="Sua senha" required>
                </div>
                <div id="error-message" class="error-message" style="display: none;"></div>
                <div id="success-message" class="success-message" style="display: none;"></div>
                <button type="submit" id="cadastro" class="btn-primary cadastro-btn">Salvar alterações</button>
            </form>
        </div>
    </div>
</body>

<div id="footer-placeholder"></div>

<script src="Assets/JavaScript/cadastro.js" type="module"></script>
<script src="Assets/JavaScript/utils.js" type="module"></script>
<script src="Assets/JavaScript/loadFooterAndHeader.js"></script>

</html>
